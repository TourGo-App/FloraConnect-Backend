name: Review contributor action plan

on:
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-plan-${{ github.repository }}-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      !github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read trusted default-branch automation
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check plan and update the automated reply
        run: node .github/scripts/review-issue-plan.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
